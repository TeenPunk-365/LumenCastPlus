<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LumenCast — Подкасты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./webapp/styles.css" />
</head>
<body>
  <div class="app">
    <main class="main" id="main" data-tab="home">
      <div class="topbar">
        <div class="brand">
          <p class="eyebrow">LumenCast</p>
          <h1 class="greeting" id="greeting">Добрый день</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="notify-btn" title="Сменить тему" aria-label="Сменить тему">🌙</button>
          <button class="icon-btn" id="history-btn" title="Библиотека" aria-label="Библиотека">🕘</button>
          <div class="avatar" id="avatar">?</div>
        </div>
      </div>

      <section class="view active" id="view-home">
        <div class="quick-grid" id="quick-grid"></div>
        <div class="section">
          <div class="section-head"><h2>Подобрано для вас</h2><a href="#" data-goto="search">Все</a></div>
          <div class="card-row" id="made-for-you"></div>
        </div>
        <div class="section">
          <div class="section-head"><h2>Популярные подкасты</h2><a href="#" data-goto="search">Все</a></div>
          <div class="card-row" id="popular-playlists"></div>
        </div>
        <div class="section">
          <div class="section-head"><h2>Недавно слушали</h2><a href="#" data-goto="library">Все</a></div>
          <div class="card-row" id="recently-played"></div>
        </div>
      </section>

      <section class="view" id="view-search">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input id="search-input" type="search" placeholder="Поиск эпизодов, подкастов или авторов" autocomplete="off" />
        </div>

        <form class="rss-form" id="rss-form">
          <label class="rss-label" for="rss-input">Добавить RSS-подкаст</label>
          <div class="rss-row">
            <input id="rss-input" class="rss-input" type="url" placeholder="https://example.com/feed.xml" inputmode="url" />
            <button class="rss-btn" type="submit">Добавить</button>
          </div>
          <p class="rss-status" id="rss-status">Загружаю подборку подкастов...</p>
        </form>

        <div id="search-default">
          <div class="section-head"><h2>Бесплатные RSS-подкасты</h2></div>
          <div class="feed-grid" id="featured-feeds"></div>
        </div>
        <div id="search-results-wrap" style="display:none">
          <div class="section-head"><h2>Результаты</h2></div>
          <div class="search-results" id="search-results"></div>
        </div>
      </section>

      <section class="view" id="view-library">
        <div class="filter-row" id="filter-row">
          <button class="filter-chip active" data-filter="all">Все</button>
          <button class="filter-chip" data-filter="playlist">Подкасты</button>
          <button class="filter-chip" data-filter="artist">Авторы</button>
        </div>
        <div class="lib-list" id="lib-list"></div>
      </section>
    </main>

    <footer class="player" id="player">
      <div class="player-main">
        <div class="player-art" id="player-art"><span>🎙️</span></div>
        <div class="player-meta">
          <div class="title" id="player-title">Не выбрано</div>
          <div class="sub" id="player-sub">Выберите эпизод</div>
        </div>
        <div class="player-controls">
          <button class="p-btn" id="like-btn" title="Нравится" aria-label="Нравится">♡</button>
          <button class="p-btn" id="prev-btn" title="Назад" aria-label="Назад">⏮</button>
          <button class="p-btn play" id="play-btn" title="Играть" aria-label="Играть">▶</button>
          <button class="p-btn" id="next-btn" title="Вперёд" aria-label="Вперёд">⏭</button>
        </div>
      </div>
      <div class="progress-wrap">
        <span id="time-cur">0:00</span>
        <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span id="time-dur">0:00</span>
      </div>
    </footer>

    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home"><span class="nav-icon">⌂</span><span>Главная</span></button>
      <button class="nav-item" data-tab="search"><span class="nav-icon">⌕</span><span>Поиск</span></button>
      <button class="nav-item" data-tab="library"><span class="nav-icon">▤</span><span>Библиотека</span></button>
    </nav>
  </div>
  <script type="module" src="./webapp/js/main.js"></script>
</body>
</html>
